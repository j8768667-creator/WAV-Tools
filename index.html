<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAV Batch Trimmer</title>

https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.jsscript>
app.jsscript>

<style>
body{
    margin:0;
    padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f5f5f7;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:24px;
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    color:#2563eb;
    margin-top:0;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:600;
}

input[type=file],
input[type=number]{
    width:100%;
    padding:10px;
    font-size:16px;
}

button{
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    background:#999;
}

progress{
    width:100%;
    height:24px;
    margin-top:15px;
}

#status{
    margin-top:20px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:10px;
    min-height:120px;
    white-space:pre-wrap;
    overflow:auto;
}
</style>
</head>
<body>

<div class="container">

<h1>WAV Batch Trimmer</h1>

<label>Select WAV Files</label>
<input id="files" type="file" accept=".wav" multiple>

<label>Trim Length (Seconds)</label>
<input id="duration" type="number" value="5" min="0.1" step="0.1">

<button id="startBtn">
Trim WAV Files & Download ZIP
</button>

<progress id="progress" value="0" max="100"></progress>

<div id="status">
Ready.
</div>

</div>

</body>
</html>
